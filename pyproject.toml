[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cota"
version = "0.1.0"
description = "Plataforma Web de Análisis Experimental, Metrología y Reportes Científicos"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "pint>=0.23",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/777aeterna/cota"
Repository = "https://github.com/777aeterna/cota"
Issues = "https://github.com/777aeterna/cota/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cota.web" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
